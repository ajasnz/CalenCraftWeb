{% extends "base.html" %}
{% import '_icons.html' as icons %}
{% block title %}Add Source — {{ cal.title }}{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('ui.calendar_detail', calendar_slug=cal.slug) }}">{{ icons.icon('chevron-left') }} Back to {{ cal.title }}</a>
<div class="page-header">
  <h2>Add Source to "{{ cal.title }}"</h2>
</div>
<div class="form-card">
  <form method="post">
    <label for="url">iCal URL</label>
    <input id="url" name="url" type="url" required autofocus placeholder="https://example.com/calendar.ics">
    <label for="name">Display Name</label>
    <input id="name" name="name" type="text" placeholder="Optional friendly name">
    <button type="submit" class="btn">Add Source</button>
  </form>
</div>
{% endblock %}
