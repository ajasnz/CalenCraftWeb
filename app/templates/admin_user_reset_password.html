{% extends "base.html" %}
{% block title %}Reset Password — {{ user.username }}{% endblock %}
{% block content %}
<div class="page-header">
  <h2>Reset Password</h2>
</div>
<div class="form-card">
  <p style="margin-bottom:1rem;font-size:.9rem">Setting a new password for <strong>{{ user.username }}</strong>.</p>
  <form method="post">
    <label for="new_password">New Password</label>
    <input id="new_password" name="new_password" type="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
    <label for="confirm_password">Confirm Password</label>
    <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password">
    <div style="display:flex;gap:.75rem;margin-top:1.35rem">
      <button type="submit" class="btn">Reset Password</button>
      <a class="btn btn-ghost" href="{{ url_for('ui.admin_users') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
