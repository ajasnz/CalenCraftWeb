{% extends "base.html" %}
{% import '_icons.html' as icons %}
{% block title %}New View — {{ cal.title }}{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('ui.calendar_detail', calendar_slug=cal.slug) }}">{{ icons.icon('chevron-left') }} Back to {{ cal.title }}</a>
<div class="page-header">
  <h2>New View for "{{ cal.title }}"</h2>
</div>
<div class="form-card">
  <form method="post">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" required autofocus placeholder="e.g. Work Only">
    <p class="hint">A URL-friendly slug will be generated automatically.</p>
    <button type="submit" class="btn">Create View</button>
  </form>
</div>
{% endblock %}
