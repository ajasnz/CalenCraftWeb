{% extends "base.html" %}
{% block title %}Profile — CalenCraft{% endblock %}
{% block content %}
<div class="page-header">
  <h2>Your Profile</h2>
</div>

<div class="form-card">
  <div class="form-card-title">Account Details</div>
  <form method="post">
    <input type="hidden" name="_action" value="profile">
    <label>Username</label>
    <input type="text" value="{{ user.username }}" disabled>
    <label for="display_name">Display Name</label>
    <input id="display_name" name="display_name" type="text" value="{{ user.display_name or '' }}" placeholder="{{ user.username }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ user.email or '' }}" placeholder="Optional">
    <button type="submit" class="btn">Save Changes</button>
  </form>
</div>

<div class="form-card">
  <div class="form-card-title">Change Password</div>
  <form method="post">
    <input type="hidden" name="_action" value="password">
    <label for="current_password">Current Password</label>
    <input id="current_password" name="current_password" type="password" required autocomplete="current-password">
    <label for="new_password">New Password</label>
    <input id="new_password" name="new_password" type="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
    <label for="confirm_password">Confirm New Password</label>
    <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password">
    <button type="submit" class="btn">Change Password</button>
  </form>
</div>
{% endblock %}
