{% extends "base.html" %}
{% import '_icons.html' as icons %}
{% block title %}New Calendar — CalenCraft{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('ui.dashboard') }}">{{ icons.icon('chevron-left') }} Back to dashboard</a>
<div class="page-header">
  <h2>New Calendar</h2>
</div>
<div class="form-card">
  <form method="post">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" required autofocus placeholder="e.g. Work + Personal">
    <button type="submit" class="btn">Create Calendar</button>
  </form>
</div>
{% endblock %}
